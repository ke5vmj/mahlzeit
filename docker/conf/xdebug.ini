zend_extension=xdebug.so
xdebug.output_dir = ${XDEBUG_PROFILER_DIR}
xdebug.show_local_vars = ${XDEBUG_SHOW_VARS}
xdebug.client_host = ${XDEBUG_REMOTE_HOST}
xdebug.client_port = ${XDEBUG_REMOTE_PORT}
xdebug.idekey= ${XDEBUG_IDE_KEY}
xdebug.trigger_value = ${XDEBUG_PROFILER_ENABLE_TRIGGER_VALUE}
xdebug.profiler_append = ${XDEBUG_PROFILER_APPEND}
xdebug.profiler_output_name = ${XDEBUG_PROFILER_OUTPUT_NAME}
xdebug.start_with_request = yes
xdebug.mode=${XDEBUG_MODE}