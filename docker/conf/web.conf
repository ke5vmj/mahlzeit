# 1. Redirect all HTTP traffic to HTTPS
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/

    # Smoothly hands off all visitors to the secure HTTPS version
    Redirect permanent / https://localhost/
</VirtualHost>

# 2. Handle the secure SSL/TLS traffic
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/localhost.crt
    SSLCertificateKeyFile /etc/ssl/private/localhost.key

    <Directory /var/www/html/>
        # -Indexes: Prevents visitors from seeing a list of files in a directory.
        # -MultiViews: Prevents issues with Drupal's URL routing system.
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Keeps your standard container/stdout logging intact
    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined
</VirtualHost>